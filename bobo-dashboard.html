<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bobo 华文小行星 🌟 全册版</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #fff5c2, #ffd1dc, #c2f0ff);
    min-height: 100vh;
    color: #333;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    flex-wrap: wrap; gap: 10px;
  }
  .topbar h1 { margin: 0; font-size: 20px; }
  .topbar .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge {
    background: #ff6b6b; color: white; padding: 5px 12px;
    border-radius: 999px; font-size: 13px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.1);
  }
  .badge.blue { background: #0984e3; }
  .badge.green { background: #00b894; }
  .container { padding: 14px; max-width: 1200px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    padding: 9px 14px; border-radius: 12px; border: none;
    background: white; font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.05);
    transition: transform .1s;
  }
  .tab:hover { transform: translateY(-1px); }
  .tab.active { background: #6c5ce7; color: white; }
  .panel { display: none; animation: fadeIn .2s; }
  .panel.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 10px;
  }
  .card {
    background: white; border-radius: 14px; padding: 12px;
    text-align: center; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.05);
    transition: transform .1s;
    position: relative;
  }
  .card:active { transform: translateY(2px); }
  .card .char { font-size: 36px; font-weight: bold; color: #2d3436; }
  .card .meta { font-size: 11px; color: #636e72; margin-top: 3px; }
  .card .tags { margin-top: 5px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
  .tag {
    font-size: 10px; padding: 2px 7px; border-radius: 999px;
    background: #dfe6e9; color: #2d3436;
  }
  .tag.write { background: #ffeaa7; }
  .tag.done { background: #55efc4; color: #006644; }
  .tag.weak { background: #fab1a0; }
  .progress {
    background: white; border-radius: 14px; padding: 14px; margin-bottom: 14px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.05);
  }
  .progress h3 { margin: 0 0 8px; font-size: 16px; }
  .bar-wrap { background: #dfe6e9; border-radius: 999px; height: 12px; overflow: hidden; }
  .bar { height: 100%; background: linear-gradient(90deg,#fdcb6e,#e17055); width: 0%; transition: width .3s; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .stat {
    flex: 1; min-width: 90px; background: #f8f9fa; border-radius: 10px; padding: 8px;
    text-align: center;
  }
  .stat .num { font-size: 20px; font-weight: bold; }
  .stat .lbl { font-size: 11px; color: #636e72; }
  .quiz {
    background: white; border-radius: 14px; padding: 16px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.05);
    max-width: 700px; margin: 0 auto;
  }
  .quiz .q { font-size: 20px; margin-bottom: 10px; line-height: 1.5; }
  .quiz .choices { display: grid; gap: 8px; }
  .quiz .choice {
    padding: 10px 12px; border-radius: 10px; border: 2px solid #dfe6e9;
    background: white; font-size: 16px; cursor: pointer; text-align: left;
  }
  .quiz .choice:hover { border-color: #6c5ce7; }
  .quiz .choice.correct { background: #55efc4; border-color: #00b894; }
  .quiz .choice.wrong { background: #ff7675; border-color: #d63031; color: white; }
  .quiz .feedback { margin-top: 12px; font-size: 15px; min-height: 22px; }
  .sticker { font-size: 56px; text-align: center; animation: pop .4s; }
  @keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.2); } to { transform: scale(1); } }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn {
    padding: 8px 12px; border: none; border-radius: 10px; cursor: pointer;
    background: #6c5ce7; color: white; font-size: 13px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .btn.secondary { background: #b2bec3; }
  .lesson-section {
    background: white; border-radius: 14px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.05);
  }
  .lesson-section h3 { margin: 0 0 8px; font-size: 16px; }
  .reading {
    background: #fff9e6; border-left: 4px solid #fdcb6e;
    padding: 10px; border-radius: 8px; line-height: 1.7;
    font-size: 15px;
  }
  .question { margin: 8px 0; padding: 8px; background: #f8f9fa; border-radius: 8px; }
  .question .prompt { font-weight: bold; }
  .answer-slot {
    margin-top: 6px; display: flex; gap: 6px; align-items: center;
  }
  .answer-slot input {
    flex: 1; padding: 7px 9px; border-radius: 8px; border: 2px solid #dfe6e9;
    font-size: 15px;
  }
  .answer-slot input.correct { border-color: #00b894; background: #e6fff7; }
  .answer-slot input.wrong { border-color: #d63031; background: #ffeaea; }
  .stars { font-size: 20px; letter-spacing: 3px; }
  .lesson-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .lesson-tab {
    padding: 6px 12px; border-radius: 999px; border: 2px solid #dfe6e9;
    background: white; font-size: 13px; cursor: pointer;
  }
  .lesson-tab.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .filter-bar label { font-size: 13px; color: #636e72; }
  .empty { color: #999; padding: 10px 0; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🌟 Bobo 华文小行星 · 全册版</h1>
  <div class="meta">
    <button class="tab" id="btnSyncUp" title="上传进度到云端">⬆️ 同步</button>
    <button class="tab" id="btnSyncDown" title="从云端下载进度">⬇️ 恢复</button>
    <div class="badge blue" id="badgeLesson">第11-19课</div>
    <div class="badge" id="starBadge">⭐ 0</div>
    <div class="badge green" id="streakBadge">🔥 0天</div>
  </div>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-tab="learn">📚 学习</button>
    <button class="tab" data-tab="review">🔁 复习</button>
    <button class="tab" data-tab="errors">🩹 错词本</button>
    <button class="tab" data-tab="progress">📈 进度</button>
    <button class="tab" data-tab="write">✍️ 写话</button>
  </div>

  <!-- 学习 -->
  <div id="learn" class="panel show">
    <div class="progress">
      <h3>全册总进度</h3>
      <div class="bar-wrap"><div class="bar" id="totalBar"></div></div>
      <div class="stats">
        <div class="stat"><div class="num" id="statChars">0/0</div><div class="lbl">生字</div></div>
        <div class="stat"><div class="num" id="statRead">0/0</div><div class="lbl">阅读</div></div>
        <div class="stat"><div class="num" id="statWrite">0/0</div><div class="lbl">写话</div></div>
        <div class="stat"><div class="num" id="statDays">0</div><div class="lbl">累计天数</div></div>
      </div>
    </div>
    <div class="lesson-tabs" id="lessonTabs"></div>
    <div id="lessonContent"></div>
  </div>

  <!-- 复习 -->
  <div id="review" class="panel">
    <div class="quiz" id="quizBox">
      <div class="q" id="quizQ">选择复习模式开始！</div>
      <div class="choices" id="quizChoices"></div>
      <div class="feedback" id="quizFeedback"></div>
      <div class="actions">
        <button class="btn" onclick="nextQuiz()">下一题</button>
        <button class="btn secondary" onclick="switchTab('learn')">回到学习</button>
      </div>
    </div>
  </div>

  <!-- 错词本 -->
  <div id="errors" class="panel">
    <div class="progress">
      <h3>🩹 错词本</h3>
      <div class="filter-bar">
        <label>类型：</label>
        <select id="errorFilter" onchange="renderErrors()">
          <option value="all">全部</option>
          <option value="char">字词错误</option>
          <option value="read">阅读错误</option>
          <option value="quiz">测验错误</option>
        </select>
        <button class="btn secondary" onclick="clearErrors()" style="font-size:12px;">清空</button>
      </div>
      <div id="errorList"></div>
    </div>
  </div>

  <!-- 进度 -->
  <div id="progress" class="panel">
    <div class="progress">
      <h3>每日贴纸墙 🏅</h3>
      <div class="stars" id="starWall">还没有星星哦，快去学习吧！</div>
    </div>
    <div class="progress">
      <h3>已学会的生字</h3>
      <div class="grid" id="masteredGrid"></div>
    </div>
    <div class="progress">
      <h3>还需要加强的字</h3>
      <div class="grid" id="weakGrid"></div>
    </div>
    <div class="progress">
      <h3>本周学习统计</h3>
      <div class="stats" id="weeklyStats"></div>
    </div>
  </div>

  <!-- 写话 -->
  <div id="write" class="panel">
    <div class="quiz" id="writeBox">
      <div class="q" id="writeQ"></div>
      <div style="font-size:13px;color:#636e72;margin-bottom:8px;">用上给出的字，写一句完整的话。</div>
      <input id="writeAnswer" placeholder="在这里写句子..." />
      <div class="answer-slot">
        <button class="btn" onclick="checkWrite()">检查</button>
        <button class="btn secondary" onclick="nextWrite()">换一题</button>
      </div>
      <div class="feedback" id="writeFeedback"></div>
    </div>
  </div>
</div>

const LS = {
  get(k,d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
};

let state = LS.get("bobo_state_v3", {
  stars: 0,
  mastered: [],
  weak: [],
  readDone: [],
  writeDone: [],
  days: [],
  stickers: [],
  errors: [],
  quizScore: 0,
  quizTotal: 0,
  currentLesson: 11
});

// clear old storage
LS.set("bobo_state_v2", {
  stars: 0,
  mastered: [],
  weak: [],
  readDone: [],
  writeDone: [],
  days: [],
  stickers: [],
  errors: [],
  quizScore: 0,
  quizTotal: 0,
  currentLesson: 11
});

function save(){ LS.set("bobo_state_v3", state); updateUI(); }
function syncUp(){
  fetch("/api/state",{method:"POST",body:JSON.stringify(state),headers:{"Content-Type":"application/json"}}).then(r=>r.text()).then(t=>alert("已同步到云端：\n"+t)).catch(e=>alert("同步失败："+e));
}
function syncDown(){
  if(!confirm("云端进度会覆盖当前本地进度，确定吗？")) return;
  fetch("/api/state").then(r=>r.json()).then(d=>{ state = d ?? state; save(); alert("已恢复云端进度。"); }).catch(e=>alert("恢复失败："+e));
}
window.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("btnSyncUp")?.addEventListener("click", syncUp);
  document.getElementById("btnSyncDown")?.addEventListener("click", syncDown);
});

function today(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function addStar(n=1){
  state.stars += n;
  const t = today();
  if(!state.days.includes(t)) state.days.push(t);
  const st = {date:t, emoji:["⭐","🌟","🎉","🌈","🦄","🍕","🎈","🏆","🎈","🌟"][Math.floor(Math.random()*10)]};
  state.stickers.unshift(st);
  if(state.stickers.length>50) state.stickers = state.stickers.slice(0,50);
  save();
}

function addError(type, text){
  const e = {type, text, time: new Date().toLocaleString("zh-CN", {timeZone:"Asia/Singapore"})};
  state.errors.unshift(e);
  if(state.errors.length>200) state.errors = state.errors.slice(0,200);
  save();
}

function tabDone(prefix, lessonId, idx){
  const key = `${prefix}_${lessonId}_${idx}`;
  if(!state[prefix].includes(key)){ state[prefix].push(key); addStar(); save(); }
}

function isTabDone(prefix, lessonId, idx){
  return state[prefix].includes(`${prefix}_${lessonId}_${idx}`);
}

function allChars(){
  const set = new Set();
  DATA.lessons.forEach(l=>l.chars.forEach(ch=>set.add(ch.c)));
  return [...set];
}

function charsByLesson(lessonId){
  const L = DATA.lessons.find(l=>l.id===lessonId);
  return L ? L.chars : [];
}

function updateUI(){
  document.getElementById("starBadge").textContent = `⭐ ${state.stars}`;
  const totalDays = state.days.length;
  document.getElementById("streakBadge").textContent = `🔥 ${totalDays}天`;
  document.getElementById("badgeLesson").textContent = `第11-19课`;

  const total = allChars().length;
  const masteredCount = state.mastered.length;
  const pct = Math.round((masteredCount/total)*100);
  document.getElementById("totalBar").style.width = pct+"%";
  document.getElementById("statChars").textContent = `${masteredCount}/${total}`;
  const readTotal = DATA.lessons.reduce((a,l)=>a+l.read.length,0);
  document.getElementById("statRead").textContent = `${state.readDone.length}/${readTotal}`;
  const writeTotal = DATA.lessons.reduce((a,l)=>a+l.write.length,0);
  document.getElementById("statWrite").textContent = `${state.writeDone.length}/${writeTotal}`;
  document.getElementById("statDays").textContent = totalDays;

  renderLessons();
  renderMastered();
  renderStarWall();
  renderErrors();
  renderWeekly();
}

function setLesson(id){
  state.currentLesson = id;
  save();
}

function checkRead(btn){
  const input = btn.previousElementSibling;
  const li = +input.dataset.l, ri = +input.dataset.r, qi = +input.dataset.qi;
  const answer = input.value.trim();
  const L = DATA.lessons.find(l=>l.id===li);
  const correct = L.read[ri].answers[qi];
  if(!answer){ input.focus(); return; }
  if(answer.includes(correct) || correct.includes(answer)){
    input.classList.add("correct"); input.classList.remove("wrong");
    tabDone("readDone", li, ri);
  } else {
    input.classList.add("wrong"); input.classList.remove("correct");
    addError("read", `第${li}课阅读：${L.read[ri].questions[qi]} — 你的答案：${answer}，正确答案：${correct}`);
  }
}

function checkWriteLesson(btn){
  const input = btn.previousElementSibling;
  const li = +input.dataset.l, wi = +input.dataset.w;
  const L = DATA.lessons.find(l=>l.id===li);
  const w = L.write[wi];
  const val = input.value.trim();
  const fb = input.parentElement.nextElementSibling;
  if(!val){ fb.textContent = "先写一句话哦～"; input.focus(); return; }
  const hasWord = w.words.some(word=>val.includes(word));
  const len = val.length;
  if(hasWord && len>=4){
    fb.innerHTML = `✅ 不错！参考：${w.sample}`;
    tabDone("writeDone", li, wi);
  } else {
    fb.innerHTML = `💡 试试参考：${w.sample}`;
    addError("char", `第${li}课写话：${w.words.join("/")} — 句子：${val}`);
  }
}

function toggleMastered(c){
  const i = state.mastered.indexOf(c);
  if(i>=0){ state.mastered.splice(i,1); }
  else { state.mastered.push(c); addStar(1); }
  state.weak = state.weak.filter(x=>x!==c);
  save();
}

function renderMastered(){
  const all = allChars();
  document.getElementById("masteredGrid").innerHTML = state.mastered.map(c=>
    `<div class="card"><div class="char">${c}</div><div class="tags"><span class="tag done">✅ 已掌握</span></div></div>`
  ).join("") || "<div class='empty'>还没有标记，点击生字可标记。</div>";
  const weak = all.filter(c=>!state.mastered.includes(c));
  document.getElementById("weakGrid").innerHTML = weak.map(c=>
    `<div class="card"><div class="char">${c}</div><div class="tags"><span class="tag weak">📖 复习</span></div></div>`
  ).join("") || "<div class='empty' style='color:#00b894;'>太棒了，全部已掌握！</div>";
}

function renderStarWall(){
  const el = document.getElementById("starWall");
  if(!state.stickers.length){ el.textContent = "还没有星星哦，快去学习吧！"; return; }
  el.innerHTML = state.stickers.map(s=>`<span title="${s.date}">${s.emoji}</span>`).join(" ");
}

function renderWeekly(){
  const el = document.getElementById("weeklyStats");
  const now = new Date();
  const weekAgo = new Date(now.getTime() - 7*24*60*60*1000);
  const wa = `${weekAgo.getFullYear()}-${String(weekAgo.getMonth()+1).padStart(2,'0')}-${String(weekAgo.getDate()).padStart(2,'0')}`;
  const weekDays = state.days.filter(d=>d>=wa).length;
  const weekStars = state.stickers.filter(s=>s.date>=wa).length;
  el.innerHTML = `
    <div class="stat"><div class="num">${weekDays}</div><div class="lbl">本周学习天数</div></div>
    <div class="stat"><div class="num">${weekStars}</div><div class="lbl">本周贴纸数</div></div>
    <div class="stat"><div class="num">${state.stars}</div><div class="lbl">累计星星</div></div>
  `;
}

// ===== Quiz =====
let quiz = null;
let quizMode = "all"; // all | weak | lesson
let quizState = null; // {pool, i, score}

function startQuiz(){
  let pool;
  if(quizMode === "weak"){
    const weakChars = allChars().filter(c=>!state.mastered.includes(c));
    pool = DATA.quizzes.filter(q=>q.lesson===null || weakChars.some(c=>q.q.includes(c)));
    if(!pool.length) pool = DATA.quizzes.slice(0,8);
  } else if(quizMode === "lesson"){
    const L = DATA.lessons.find(l=>l.id===state.currentLesson);
    const lChars = L.chars.map(c=>c.c);
    pool = DATA.quizzes.filter(q=>q.lesson===null || q.lesson===state.currentLesson || lChars.some(c=>q.q.includes(c)));
  } else {
    pool = DATA.quizzes.slice();
  }
  pool = [...pool].sort(()=>Math.random()-0.5).slice(0,10);
  quizState = {pool, i:0, score:0};
  showQuiz();
}

function nextQuiz(){
  if(!quizState) { startQuiz(); return; }
  quizState.i++;
  showQuiz();
}

function showQuiz(){
  const {pool, i, score} = quizState;
  if(i>=pool.length){
    document.getElementById("quizQ").innerHTML = `复习完成！得分：<b>${score}/${pool.length}</b>`;
    document.getElementById("quizChoices").innerHTML = "";
    document.getElementById("quizFeedback").innerHTML = score>=8 ? "🏆 太棒了！给你大星星！" : score>=5 ? "👍 不错，继续加油！" : "💪 再复习一次会更好！";
    addStar(score>=5?2:1);
    quizState = null;
    return;
  }
  quiz = pool[i];
  document.getElementById("quizQ").textContent = `${i+1}. ${quiz.q}`;
  document.getElementById("quizFeedback").textContent = "";
  document.getElementById("quizChoices").innerHTML = quiz.choices.map((c,idx)=>
    `<button class="choice" onclick="pickQuiz(${idx})">${c}</button>`
  ).join("");
}

window.pickQuiz = function(idx){
  const btns = document.querySelectorAll("#quizChoices .choice");
  if(quiz.answered) return;
  quiz.answered = true;
  btns.forEach((b,bi)=>{
    b.disabled = true;
    if(bi===quiz.a) b.classList.add("correct");
  });
  if(idx===quiz.a){
    document.getElementById("quizFeedback").textContent = "✅ 答对了！+⭐";
    quizState.score++;
  } else {
    btns[idx].classList.add("wrong");
    document.getElementById("quizFeedback").textContent = `❎ 正确答案是：${quiz.choices[quiz.a]}`;
    addError("quiz", `${quiz.q} — 你的答案：${quiz.choices[idx]}，正确答案：${quiz.choices[quiz.a]}`);
  }
  setTimeout(nextQuiz, 900);
};

// ===== 写话 =====
let wp = null;
function nextWrite(){
  wp = DATA.writePrompts[Math.floor(Math.random()*DATA.writePrompts.length)];
  document.getElementById("writeQ").innerHTML = `💬 ${wp.hint}<br/><span style="color:#6c5ce7;font-size:13px;">用上：${wp.words.join("、")}</span>`;
  document.getElementById("writeAnswer").value = "";
  document.getElementById("writeFeedback").textContent = "";
}
function checkWrite(){
  const val = document.getElementById("writeAnswer").value.trim();
  const fb = document.getElementById("writeFeedback");
  if(!val){ fb.textContent = "先写一句话哦～"; return; }
  const hasWord = wp.words.some(w=>val.includes(w));
  const len = val.length;
  if(hasWord && len>=4){
    fb.innerHTML = `✅ 写得不错！参考：${wp.sample}`;
    addStar(1);
  } else {
    fb.innerHTML = `💡 试试参考：${wp.sample}`;
    addError("char", `写话：${wp.words.join("/")} — 句子：${val}`);
  }
}

// ===== 错词本 =====
function renderErrors(){
  const filter = document.getElementById("errorFilter").value;
  let list = state.errors;
  if(filter !== "all") list = list.filter(e=>e.type===filter);
  const el = document.getElementById("errorList");
  if(!list.length){ el.innerHTML = "<div class='empty'>还没有错题记录，继续加油！</div>"; return; }
  el.innerHTML = list.slice(0,50).map(e=>`
    <div style="padding:8px;border-bottom:1px solid #f0f0f0;font-size:13px;">
      <div style="color:#636e72;">${e.time}</div>
      <div style="margin-top:2px;">${e.type==='read'?'📖阅读':e.type==='quiz'?'🔁测验':'✍️写话'}：${e.text}</div>
    </div>
  `).join("");
}
function clearErrors(){
  if(confirm("确定清空错词本？")){ state.errors=[]; save(); }
}

// ===== Tabs =====
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("show", p.id===name));
  if(name==="review"){
    document.getElementById("quizQ").textContent = "选择复习模式：";
    document.getElementById("quizChoices").innerHTML = `
      <button class="choice" onclick="setQuizMode('all')">📚 全册综合复习</button>
      <button class="choice" onclick="setQuizMode('weak')">🎯 只复习不会的字</button>
      <button class="choice" onclick="setQuizMode('lesson')">📖 复习当前课文</button>
    `;
    document.getElementById("quizFeedback").textContent = "";
  }
  if(name==="write" && !wp) nextWrite();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));

function setQuizMode(mode){
  quizMode = mode;
  nextQuiz();
}

// Init
updateUI();
nextWrite();
</script>
